name: Build BudgetAI IPA (unsigned)

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Stable personal bundle ID (keep unchanged for later updates)
        required: true
        default: com.personal.budgetai.h6klv4u0xbpkhe31v9hk0
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      BUNDLE_ID: ${{ inputs.bundle_id }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source and build unsigned iPhone archive
        run: python3 scripts/build_ipa.py
      - name: Run BudgetAITests unit test suite
        run: |
          DEV_DIR=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)/Contents/Developer
          if [ ! -d "$DEV_DIR" ]; then DEV_DIR="/Applications/Xcode.app/Contents/Developer"; fi
          export DEVELOPER_DIR="$DEV_DIR"
          echo "Running BudgetAITests on Simulator: iPhone 16"
          xcodebuild test \
            -project ios-budget-ai/BudgetAI.xcodeproj \
            -scheme BudgetAI \
            -only-testing:BudgetAITests \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""
      - name: Upload verified unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BudgetAI-unsigned-IPA
          path: |
            build/output/BudgetAI-unsigned.ipa
            build/output/SHA256SUMS.txt
            build/output/build-info.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload build diagnostics (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BudgetAI-build-diagnostics
          path: |
            build/logs/
            build/Archive.xcresult/
          if-no-files-found: warn
          retention-days: 7